<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevTar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Roboto, Arial, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }
        .header { position: sticky; top: 0; z-index: 20; background: #1565c0; color: white; padding: 16px; text-align: center; font-size: 22px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
        .container { max-width: 650px; margin: auto; padding: 12px; }
        .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.08); }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #475569; font-weight: bold; }
        .sub-label { display: block; font-size: 12px; color: #64748b; margin-top: -3px; margin-bottom: 10px; font-weight: normal; }
        input { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 16px; margin-bottom: 14px; outline: none; }
        input:focus { border-color: #1565c0; box-shadow: 0 0 0 2px rgba(21, 101, 192, .15); }
        input.error { border-color: red; }
        .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .radio-btn { position: relative; }
        .radio-btn input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
        .radio-label { display: block; text-align: center; padding: 12px; background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 10px; font-weight: bold; cursor: pointer; transition: all .2s ease; margin-bottom: 0; }
        .radio-btn input[type="radio"]:checked + .radio-label { background: #e0e7ff; border-color: #1565c0; color: #1565c0; }
        button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #1565c0; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #94a3b8; }
        .rekap-box { margin-bottom: 12px; padding: 12px; background: #f1f5f9; border-radius: 10px; font-size: 13px; }
        .rekap-title { font-weight: bold; margin-bottom: 6px; color: #334155; }
        .rekap-content { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .rekap-item { font-weight: bold; color: #1565c0; }
        .rekap-total { font-weight: bold; color: #0f172a; border-left: 2px solid #cbd5e1; padding-left: 6px; margin-left: 2px; }
        .rekap-ya { color: #16a34a; }
        .rekap-tidak { color: #dc2626; }
        .search { margin-bottom: 10px; }
        .table-wrap { overflow: auto; max-height: 400px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead { position: sticky; top: 0; z-index: 5; }
        th { background: #1565c0; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        tr:nth-child(even) { background: #f8fafc; }
        .waktu-col { font-size: 12px; color: #64748b; white-space: nowrap; }
        .loading { display: none; text-align: center; padding: 15px; }
        .spinner { width: 30px; height: 30px; border-radius: 50%; border: 4px solid #ddd; border-top-color: #1565c0; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .snackbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 20px; border-radius: 20px; display: none; z-index: 100; font-size: 14px; max-width: 90%; text-align: center; }
        
        @media(prefers-color-scheme:dark) {
            body { background: #0f172a; color: white; }
            .card { background: #1e293b; }
            input { background: #334155; color: white; border-color: #475569; }
            label { color: #cbd5e1; }
            .sub-label { color: #94a3b8; }
            .radio-label { background: #334155; border-color: #475569; color: white; }
            .radio-btn input[type="radio"]:checked + .radio-label { background: #1e3a8a; border-color: #60a5fa; color: white; }
            .rekap-box { background: #334155; }
            .rekap-title { color: #cbd5e1; }
            .rekap-item { color: #60a5fa; }
            .rekap-total { color: #f8fafc; border-left-color: #475569; }
            .rekap-ya { color: #4ade80; }
            .rekap-tidak { color: #f87171; }
            td { color: white; }
            tr:nth-child(even) { background: #334155; }
            .waktu-col { color: #94a3b8; }
        }
    </style>
</head>
<body>

    <div class="header">Pendaftaran Acara</div>

    <div class="container">
        <div class="card">
            <label for="pendaftar">Pendaftar - ID_Sektor ID_Kelas ID_Anggota</label>
            <span class="sub-label">Contoh: RW IA401 WAC01</span>
            
            <input id="pendaftar" type="text" placeholder="Contoh: RW IA401 WAC01" autocomplete="off" list="listPendaftar">
            <datalist id="listPendaftar"></datalist>

            <label>Konfirmasi Kedatangan</label>
            <div class="radio-group">
                <div class="radio-btn">
                    <input type="radio" id="ya" name="konfirmasi" value="YA" checked>
                    <label class="radio-label" for="ya">YA</label>
                </div>
                <div class="radio-btn">
                    <input type="radio" id="tidak" name="konfirmasi" value="TIDAK">
                    <label class="radio-label" for="tidak">TIDAK</label>
                </div>
            </div>

            <!-- Pertanyaan Pasangan -->
            <label>Apakah akan membawa pasangan?</label>
            <span class="sub-label">Catatan: Boleh membawa pasangan bila pasangan L3/L4/L5, dan pasangan di luar RW harus bayar penuh tanpa subsidi.</span>
            <div class="radio-group">
                <div class="radio-btn">
                    <input type="radio" id="pasanganYa" name="bawaPasangan" value="YA" onchange="togglePasangan()">
                    <label class="radio-label" for="pasanganYa">YA</label>
                </div>
                <div class="radio-btn">
                    <input type="radio" id="pasanganTidak" name="bawaPasangan" value="TIDAK" checked onchange="togglePasangan()">
                    <label class="radio-label" for="pasanganTidak">TIDAK</label>
                </div>
            </div>

            <!-- Form Tambahan bila Bawa Pasangan = YA -->
            <div id="boxPasangan" style="display:none;">
                <label for="idPasangan">ID Pasangan</label>
                <input id="idPasangan" type="text" placeholder="Contoh: RW IA401 WAC02" autocomplete="off" list="listPendaftar">

                <label>Apakah akan sekamar dengan pasangan?</label>
                <span class="sub-label">Catatan: Bila sekamar tersendiri, akan kena charge tambahan sesuai type kamar.</span>
                <div class="radio-group">
                    <div class="radio-btn">
                        <input type="radio" id="sekamarYa" name="sekamarPasangan" value="YA" checked>
                        <label class="radio-label" for="sekamarYa">YA</label>
                    </div>
                    <div class="radio-btn">
                        <input type="radio" id="sekamarTidak" name="sekamarPasangan" value="TIDAK">
                        <label class="radio-label" for="sekamarTidak">TIDAK</label>
                    </div>
                </div>
            </div>

            <button id="btnSimpan" onclick="simpan()">Simpan</button>
        </div>

        <div class="card">
            <div class="rekap-box">
                <div class="rekap-title">Rekap pendaftar</div>
                <div class="rekap-content" id="rekapContent"></div>
            </div>

            <input class="search" id="cari" type="text" placeholder="🔍 Cari pendaftar atau konfirmasi" oninput="filterData()">

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Memuat data...</p>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Waktu Input</th>
                            <th>Pendaftar</th>
                            <th>Konfirmasi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelData"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="snackbar" id="snackbar"></div>

    <script>
        const SPREADSHEET_ID = "1wXHuwx001LiZnAr_KU975mCrP8EGMqJsA4qRf4dn1dQ";
        const SHEET_NAME = "data";
        const API = "https://script.google.com/macros/s/AKfycby3scrvmYIs9Yljx0_NiNBWSU7VU8G2K8jpozwSUD35ysUZ90To4TXmfuoxQPGWWvua/exec";

        const LOCAL_STORAGE_KEY = "pendaftar_tersimpan_local";
        let semuaData = [];

        function ambilMemoryLokal() {
            try {
                const data = localStorage.getItem(LOCAL_STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function simpanKeMemoryLokal(pendaftar) {
            let data = ambilMemoryLokal();
            const clean = pendaftar.trim().toUpperCase();
            
            data = data.filter(item => item !== clean);
            data.push(clean);
            
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
            updateDatalistOptions();
        }

        function updateDatalistOptions() {
            const memory = ambilMemoryLokal();
            const datalist = document.getElementById("listPendaftar");
            
            datalist.innerHTML = memory.slice().reverse().map(item => `<option value="${item}">`).join("");

            const input = document.getElementById("pendaftar");
            if (memory.length > 0 && !input.value) {
                input.value = memory[memory.length - 1];
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("pendaftar");
            input.addEventListener("input", function() { this.value = this.value.toUpperCase(); });
            input.addEventListener("blur", function() { this.value = bersihkanpendaftar(this.value); });

            const inputPasangan = document.getElementById("idPasangan");
            inputPasangan.addEventListener("input", function() { this.value = this.value.toUpperCase(); });
            inputPasangan.addEventListener("blur", function() { this.value = bersihkanpendaftar(this.value); });
            
            updateDatalistOptions();
            loadData();
        });

        function bersihkanpendaftar(inputRaw) {
            let bersih = inputRaw.replace(/\s+/g, "").toUpperCase();
            const match = bersih.match(/^([A-Z]{2})([A-Z]{2}[0-9]{3})([A-Z]{3}[0-9]{2})$/);
            return match ? `${match[1]} ${match[2]} ${match[3]}` : inputRaw.toUpperCase();
        }

        function togglePasangan() {
            const ya = document.getElementById("pasanganYa").checked;
            document.getElementById("boxPasangan").style.display = ya ? "block" : "none";
            if (!ya) {
                document.getElementById("idPasangan").value = "";
                document.getElementById("sekamarYa").checked = true;
            }
        }

        async function loadData() {
            tampilLoading(true);
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("HTTP " + response.status);
                
                const text = await response.text();
                const jsonText = text.replace(/^\s*\/\*O_o\*\/\s*/, "").replace(/^google\.visualization\.Query\.setResponse\(/, "").replace(/\);\s*$/, "");
                const json = JSON.parse(jsonText);

                if (!json.table || !json.table.rows) throw new Error("Format data Google Sheet tidak valid");

                semuaData = json.table.rows.map(row => {
                    const cells = row.c || [];
                    return {
                        pendaftar: ambilCell(cells, 0),
                        konfirmasi: ambilCell(cells, 1),
                        waktuInput: ambilWaktu(cells, 2)
                    };
                }).filter(r => r.pendaftar || r.konfirmasi || r.waktuInput);

                semuaData.reverse();
                tampilTabel(semuaData);
                tampilRekap(semuaData);
            } catch (error) {
                console.error("Gagal membaca Google Sheet:", error);
                semuaData = [];
                tampilTabel([]);
                tampilRekap([]);
                snackbar("Gagal membaca Google Sheet");
            }
            tampilLoading(false);
        }

        function ambilCell(cells, index) {
            if (!cells[index]) return "";
            return cells[index].f !== undefined && cells[index].f !== null ? String(cells[index].f) :
                   cells[index].v !== undefined && cells[index].v !== null ? String(cells[index].v) : "";
        }

        function ambilWaktu(cells, index) {
            if (!cells[index]) return "";
            return cells[index].f ? String(cells[index].f) : cells[index].v ? String(cells[index].v) : "";
        }

        function tampilRekap(data) {
            let rekapMap = {}, totalSemua = 0, totalYa = 0, totalTidak = 0;
            if (Array.isArray(data)) {
                data.forEach(r => {
                    let pendaftar = (r.pendaftar || "").trim();
                    let pendaftarTanpaSpasi = pendaftar.replace(/\s+/g, "").toUpperCase();
                    
                    if (pendaftarTanpaSpasi.length >= 7) {
                        const kodeKelas = pendaftarTanpaSpasi.substring(2, 7);
                        rekapMap[kodeKelas] = (rekapMap[kodeKelas] || 0) + 1;
                        totalSemua++;
                    } else if (pendaftarTanpaSpasi.length > 0) {
                        rekapMap["LAINNYA"] = (rekapMap["LAINNYA"] || 0) + 1;
                        totalSemua++;
                    }

                    const status = (r.konfirmasi || "").trim().toUpperCase();
                    if (status === "YA") totalYa++;
                    else if (status === "TIDAK") totalTidak++;
                });
            }

            let html = Object.keys(rekapMap).sort().map(kelas => {
                const jumlah = rekapMap[kelas];
                return `<span class="rekap-item">[${kelas} = ${jumlah}]</span> `;
            }).join("");

            html += `
                <span class="rekap-total">[Total = ${totalSemua}]</span>
                <span class="rekap-total rekap-ya">[YA = ${totalYa}]</span>
                <span class="rekap-total rekap-tidak">[TIDAK = ${totalTidak}]</span>
            `;
            document.getElementById("rekapContent").innerHTML = html;
        }

        function tampilTabel(data) {
            let html = "";
            if (!Array.isArray(data) || data.length === 0) {
                html = `<tr><td colspan="3" style="text-align:center">Tidak ada data</td></tr>`;
            } else {
                data.forEach(r => {
                    const timestamp = aman(r.waktuInput || "-");
                    const pendaftar = aman(r.pendaftar || "");
                    const konfirmasi = aman(r.konfirmasi || "");

                    html += `
                        <tr>
                            <td class="waktu-col">${timestamp}</td>
                            <td>${pendaftar}</td>
                            <td>${konfirmasi}</td>
                        </tr>
                    `;
                });
            }
            document.getElementById("tabelData").innerHTML = html;
        }

        function filterData() {
            const keyword = document.getElementById("cari").value.toLowerCase();
            const hasil = semuaData.filter(r => 
                (r.pendaftar || "").toLowerCase().includes(keyword) ||
                (r.konfirmasi || "").toLowerCase().includes(keyword) ||
                (r.waktuInput || "").toLowerCase().includes(keyword)
            );
            tampilTabel(hasil);
            tampilRekap(hasil);
        }

        async function simpan() {
            const inputEl = document.getElementById("pendaftar");
            const pendaftar = bersihkanpendaftar(inputEl.value);
            inputEl.value = pendaftar;

            if (!/^[A-Z]{2}\s[A-Z]{2}[0-9]{3}\s[A-Z]{3}[0-9]{2}$/.test(pendaftar)) {
                errorInput("pendaftar", "Format pendaftar salah! Contoh: RW IA401 WAC01");
                return;
            }

            const pendaftarClean = pendaftar.trim().toUpperCase();
            if (semuaData.some(item => (item.pendaftar || "").trim().toUpperCase() === pendaftarClean)) {
                simpanKeMemoryLokal(pendaftarClean);
                errorInput("pendaftar", "Data yang diinput telah ada");
                return;
            }

            const konfirmasi = document.querySelector('input[name="konfirmasi"]:checked').value;

            const bawaPasangan = document.querySelector('input[name="bawaPasangan"]:checked').value;
            let idPasangan = "";
            let sekamarPasangan = "";

            if (bawaPasangan === "YA") {
                const idPasanganEl = document.getElementById("idPasangan");
                idPasangan = bersihkanpendaftar(idPasanganEl.value);
                idPasanganEl.value = idPasangan;

                if (!/^[A-Z]{2}\s[A-Z]{2}[0-9]{3}\s[A-Z]{3}[0-9]{2}$/.test(idPasangan)) {
                    errorInput("idPasangan", "Format ID Pasangan salah! Contoh: RW IA401 WAC02");
                    return;
                }
                sekamarPasangan = document.querySelector('input[name="sekamarPasangan"]:checked').value;
            }

            const sekarang = new Date();
            const timestamp = sekarang.toLocaleDateString("id-ID", { day: "2-digit", month: "2-digit", year: "numeric" }) + " " +
                              sekarang.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });

            const tombol = document.getElementById("btnSimpan");
            tombol.disabled = true;
            tombol.innerHTML = "Menyimpan...";

            try {
                const params = new URLSearchParams({ 
                    action: "simpan", 
                    pendaftar, 
                    konfirmasi, 
                    bawaPasangan,
                    idPasangan,
                    sekamarPasangan,
                    timestamp 
                });

                const response = await fetch(`${API}?${params.toString()}`, {
                    method: "GET",
                    redirect: "follow"
                });
                const hasil = await response.json();

                if (hasil.success) {
                    simpanKeMemoryLokal(pendaftarClean);
                    snackbar("Data berhasil disimpan");
                    document.getElementById("pendaftar").value = "";
                    document.getElementById("idPasangan").value = "";
                    document.getElementById("ya").checked = true;
                    document.getElementById("pasanganTidak").checked = true;
                    togglePasangan();
                    setTimeout(() => loadData(), 800);
                } else {
                    snackbar(hasil.message || "Gagal menyimpan");
                }
            } catch (e) {
                console.error(e);
                snackbar("Server tidak merespon");
            }
            tombol.disabled = false;
            tombol.innerHTML = "Simpan";
        }

        function tampilLoading(status) { document.getElementById("loading").style.display = status ? "block" : "none"; }
        
        function snackbar(text) {
            const s = document.getElementById("snackbar");
            s.textContent = text;
            s.style.display = "block";
            setTimeout(() => { s.style.display = "none"; }, 2500);
        }

        function errorInput(id, msg) {
            const el = document.getElementById(id);
            el.classList.add("error");
            snackbar(msg);
            setTimeout(() => { el.classList.remove("error"); }, 2000);
        }

        function aman(text) {
            if (text === null || text === undefined) return "";
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
